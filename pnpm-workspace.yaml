packages:
  - "packages/*"
  # The in-repo dogfood: the real `press create` output, consumed via workspace:*
  # for a fast dev loop. `playground/cms` is its own workspace member so the cms
  # host resolves @press/cms by symlink (the project's own pnpm-workspace.yaml is
  # dropped — pnpm has one workspace root, this repo).
  - "apps/playground"
  - "apps/playground/cms"
